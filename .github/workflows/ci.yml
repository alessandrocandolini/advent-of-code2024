name: Compile and run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual execution

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STACK_VERSION: "3.9.3"

jobs:
  stack:

    name: ${{ matrix.os }} / stack
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]

    steps:

    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Setup Haskell Stack
      id: setup
      uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-no-global: true
        stack-version: ${{ env.STACK_VERSION }}

    - name: Determine GHC version
      id: compiler
      shell: bash
      run: |
        globals=$(stack --lock-file error-on-write --color never ls globals --global-hints 2>&1)
        ghc_version=$(printf '%s\n' "$globals" | sed -n 's/^ghc-\([0-9][0-9.]*\)$/\1/p')
        test -n "$ghc_version"
        echo "version=$ghc_version" >> "$GITHUB_OUTPUT"

    - name: Restore Stack compiler
      id: stack-compiler-cache
      uses: actions/cache/restore@v6
      with:
        path: &stack-compiler-path |
          ${{ steps.setup.outputs.stack-root }}/programs/*/ghc*-${{ steps.compiler.outputs.version }}
          ${{ steps.setup.outputs.stack-root }}/programs/*/ghc*-${{ steps.compiler.outputs.version }}.installed
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-stack-compiler-${{ env.STACK_VERSION }}-${{ steps.compiler.outputs.version }}

    - name: Restore Stack dependencies
      id: stack-deps-cache
      uses: actions/cache/restore@v6
      with:
        path: &stack-dependency-paths |
          ${{ steps.setup.outputs.stack-root }}/build-plan
          ${{ steps.setup.outputs.stack-root }}/indices
          ${{ steps.setup.outputs.stack-root }}/pantry
          ${{ steps.setup.outputs.stack-root }}/snapshots
        key: ${{ runner.os }}-${{ matrix.os }}-stack-deps-${{ env.STACK_VERSION }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', '*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os }}-stack-deps-${{ env.STACK_VERSION }}-

    - name: Install dependencies
      if: (steps.stack-compiler-cache.outputs.cache-hit != 'true' || steps.stack-deps-cache.outputs.cache-hit != 'true') && success()
      timeout-minutes: 15
      run: |
        stack --lock-file error-on-write build --test --no-run-tests --only-dependencies

    - name: Save Stack compiler
      if: steps.stack-compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: *stack-compiler-path
        key: ${{ steps.stack-compiler-cache.outputs.cache-primary-key }}

    - name: Save Stack dependencies
      if: steps.stack-deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: *stack-dependency-paths
        key: ${{ steps.stack-deps-cache.outputs.cache-primary-key }}

    - name: Build and test with coverage
      timeout-minutes: 15
      run: |
        stack --lock-file error-on-write test --coverage --fast

    - name: Generate coverage report
      uses: 8c6794b6/hpc-codecov-action@v4
      with:
        target: stack:aoc2024-test
        out: ./codecov.json
        verbose: true

    - name: Send coverage report
      uses: codecov/codecov-action@v7
      with:
        files: ./codecov.json
        fail_ci_if_error: false # optional (default = false)
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
